name: Diag Datasheet Unused Fields

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node -e '
          const BASE = "https://wahapedia.ru/wh40k11ed";
          async function fetchCsv(name) {
            const res = await fetch(`${BASE}/${name}`, { headers: { "User-Agent": "Mozilla/5.0 (compatible; warcamera-4k-diag-bot/1.0)" } });
            if (!res.ok) { console.log(name, "-> HTTP", res.status); return null; }
            const text = await res.text();
            const lines = text.split("\n").map(l => l.replace(/\r$/, "")).filter(l => l.length > 0);
            const headers = lines[0].split("|");
            const rows = lines.slice(1).map(line => {
              const cells = line.split("|");
              const row = {};
              headers.forEach((h, i) => { row[h] = (cells[i] || "").trim(); });
              return row;
            });
            console.log(name, "->", rows.length, "rows, columns:", headers.join(", "));
            return rows;
          }

          async function main() {
            console.log("=== Abilities.csv raw entries (ref table) ===");
            const abilitiesRef = await fetchCsv("Abilities.csv");
            for (const a of abilitiesRef.slice(0, 6)) {
              console.log(JSON.stringify({ id: a.id, name: a.name, description: (a.description||"").slice(0,250) }));
            }
            const namedFNP = abilitiesRef.find(a => (a.name||"").toLowerCase().includes("feel no pain"));
            if (namedFNP) console.log("\nFeel No Pain ref entry:", JSON.stringify(namedFNP));
            const namedDD = abilitiesRef.find(a => (a.name||"").toLowerCase().includes("deadly demise"));
            if (namedDD) console.log("Deadly Demise ref entry:", JSON.stringify(namedDD));

            console.log("\n=== Datasheets_leader.csv sample + join check ===");
            const leader = await fetchCsv("Datasheets_leader.csv");
            console.log("Sample rows:", JSON.stringify(leader.slice(0, 5)));
            const datasheets = await fetchCsv("Datasheets.csv");
            const byId = new Map(datasheets.map(d => [d.id, d.name]));
            console.log("\nResolved sample (leader -> attached):");
            for (const row of leader.slice(0, 10)) {
              console.log(` ${byId.get(row.leader_id) || row.leader_id} -> ${byId.get(row.attached_id) || row.attached_id}`);
            }
            // find a well-known leader like Chaos Lord and show everything it can attach to
            const chaosLordIds = datasheets.filter(d => (d.name||"").toLowerCase() === "chaos lord").map(d => d.id);
            for (const id of chaosLordIds) {
              const attached = leader.filter(r => r.leader_id === id).map(r => byId.get(r.attached_id) || r.attached_id);
              console.log(`\nChaos Lord (${id}) can lead:`, attached);
            }
            const trajannId = datasheets.find(d => (d.name||"").toLowerCase() === "trajann valoris")?.id;
            if (trajannId) {
              const dsRow = datasheets.find(d => d.id === trajannId);
              console.log("\nTrajann Valoris leader_head:", JSON.stringify(dsRow.leader_head));
              console.log("Trajann Valoris leader_footer:", JSON.stringify(dsRow.leader_footer));
              const attached = leader.filter(r => r.leader_id === trajannId).map(r => byId.get(r.attached_id) || r.attached_id);
              console.log("Trajann Valoris can lead:", attached);
            }
          }
          main().catch(e => { console.error(e); process.exit(1); });
          '
