name: DIAG Mission Deck 2026-27

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the mission-deck-2026-27 page
        run: |
          curl -sL "https://wahapedia.ru/wh40k11ed/the-rules/mission-deck-2026-27/" -A "Mozilla/5.0 (compatible; warcamera-4k-diag-bot/1.0)" -o /tmp/page.html
          echo "Bytes downloaded: $(wc -c < /tmp/page.html)"
      - name: Dump raw HTML around the first Force Disposition Card (Purge the Foe), tags intact
        run: |
          python3 -c "
          html = open('/tmp/page.html', encoding='utf-8', errors='replace').read()
          start = html.find('Force Disposition Cards')
          # grab generously past the first card's block so we can see the
          # actual markup pairing each mission to an opponent icon/label
          chunk = html[start:start+9000]
          print(chunk)
          "
