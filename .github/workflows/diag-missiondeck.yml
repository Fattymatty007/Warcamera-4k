name: DIAG Mission Deck 2026-27

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the fetch-missions parser
        run: node scripts/fetch-missions.mjs
      - name: Inspect the resulting data
        run: |
          node -e "
          const d = require('./public/missions-data.json');
          console.log('Total missions:', d.missions.length);
          console.log('Dispositions:', d.dispositions);
          console.log();
          console.log('=== Sample: Purge the Foe vs Take and Hold (expect Unstoppable Force) ===');
          let m = d.missions.find(x => x.playerDisposition === 'Purge the Foe' && x.opponentDisposition === 'Take and Hold');
          console.log(JSON.stringify(m, null, 2));
          console.log();
          console.log('=== Sample: Take and Hold vs Purge the Foe (expect Immovable Object) ===');
          m = d.missions.find(x => x.playerDisposition === 'Take and Hold' && x.opponentDisposition === 'Purge the Foe');
          console.log(JSON.stringify(m, null, 2));
          console.log();
          console.log('=== Sample with an Objective Action: Disruption vs Take and Hold (expect Death Trap + Booby Trap action) ===');
          m = d.missions.find(x => x.playerDisposition === 'Disruption' && x.opponentDisposition === 'Take and Hold');
          console.log(JSON.stringify(m, null, 2));
          console.log();
          console.log('=== All mission names by (player, opponent) ===');
          for (const x of d.missions) console.log(x.playerDisposition, 'vs', x.opponentDisposition, '->', x.displayName);
          "
