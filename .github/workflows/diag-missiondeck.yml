name: DIAG Mission Deck 2026-27

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the mission-deck-2026-27 page
        run: |
          curl -sL "https://wahapedia.ru/wh40k11ed/the-rules/mission-deck-2026-27/" -A "Mozilla/5.0 (compatible; warcamera-4k-diag-bot/1.0)" -o /tmp/page.html
          echo "Bytes downloaded: $(wc -c < /tmp/page.html)"
      - name: Extract and print the Force Disposition Cards section (the 5x5 mission grid)
        run: |
          python3 -c "
          import re
          html = open('/tmp/page.html', encoding='utf-8', errors='replace').read()
          text = re.sub(r'<script.*?</script>', ' ', html, flags=re.S)
          text = re.sub(r'<style.*?</style>', ' ', text, flags=re.S)
          text = re.sub(r'<[^>]+>', '\n', text)
          text = re.sub(r'\n{2,}', '\n', text)
          text = '\n'.join(l.strip() for l in text.split('\n') if l.strip())
          start = text.find('Force Disposition Cards', text.find('Force Disposition Cards')+1)
          end = text.find('Primary Mission deck', start)
          print('SECTION LENGTH:', end - start)
          print(text[start:end])
          " 2>&1 | tee /tmp/section1.txt | wc -l
          cat /tmp/section1.txt
      - name: Extract and print the Primary Mission deck section
        run: |
          python3 -c "
          import re
          html = open('/tmp/page.html', encoding='utf-8', errors='replace').read()
          text = re.sub(r'<script.*?</script>', ' ', html, flags=re.S)
          text = re.sub(r'<style.*?</style>', ' ', text, flags=re.S)
          text = re.sub(r'<[^>]+>', '\n', text)
          text = re.sub(r'\n{2,}', '\n', text)
          text = '\n'.join(l.strip() for l in text.split('\n') if l.strip())
          start = text.find('Primary Mission deck', text.find('Primary Mission deck')+1)
          end = text.find('Deployment deck', start)
          if end == -1 or end < start: end = start + 20000
          print('SECTION LENGTH:', end - start)
          print(text[start:end])
          " 2>&1 | tee /tmp/section2.txt | wc -l
          cat /tmp/section2.txt
