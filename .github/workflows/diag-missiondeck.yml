name: DIAG Mission Deck 2026-27

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the mission-deck-2026-27 page
        run: |
          curl -sL "https://wahapedia.ru/wh40k11ed/the-rules/mission-deck-2026-27/" -A "Mozilla/5.0 (compatible; warcamera-4k-diag-bot/1.0)" -o /tmp/page.html
          echo "Bytes downloaded: $(wc -c < /tmp/page.html)"
      - name: Locate the real Force Disposition Cards section and dump raw HTML
        run: |
          python3 -c "
          html = open('/tmp/page.html', encoding='utf-8', errors='replace').read()
          import re
          # The section anchor follows the same id pattern as the other
          # headings we already saw (id=\"FAQ\", id=\"Books\"). Find it directly.
          m = re.search(r'BOOBY TRAP', html)
          print('anchor match:', m)
          start = html.rfind('cgCard_pad', 0, m.start())
          chunk = html[start:start+3500]
          print(chunk)
          print('=== DECK SECTION BOUNDS ===')
          pm = re.search(r'id=\"Primary-Mission-deck\"', html)
          dep = re.search(r'id=\"Deployment-deck\"', html)
          print('Primary-Mission-deck at', pm.start(), 'Deployment-deck at', dep.start(), 'span', dep.start()-pm.start())
          "
