name: DIAG Secondary Mission Deck

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the fetch-secondary-missions parser
        run: node scripts/fetch-secondary-missions.mjs
      - name: Inspect the resulting data
        run: |
          node -e "
          const d = require('./public/secondary-missions-data.json');
          console.log('Total missions:', d.missions.length);
          console.log();
          console.log('=== Names ===');
          for (const m of d.missions) console.log(' -', m.displayName, m.isFixedEligible ? '(fixed-eligible)' : '');
          console.log();
          console.log('=== NO PRISONERS (simple, single-VP with a cap) ===');
          console.log(JSON.stringify(d.missions.find(m => m.displayName === 'NO PRISONERS'), null, 2));
          console.log();
          console.log('=== A GRIEVOUS BLOW (WHEN DRAWN + FIXED/TACTICAL pair) ===');
          console.log(JSON.stringify(d.missions.find(m => m.displayName === 'A GRIEVOUS BLOW'), null, 2));
          console.log();
          console.log('=== ENGAGE ON ALL FRONTS (intro text, no WHEN DRAWN, OR + FIXED/TACTICAL) ===');
          console.log(JSON.stringify(d.missions.find(m => m.displayName === 'ENGAGE ON ALL FRONTS'), null, 2));
          console.log();
          console.log('=== PLUNDER (WHEN DRAWN synergy + Objective Action) ===');
          console.log(JSON.stringify(d.missions.find(m => m.displayName === 'PLUNDER'), null, 2));
          "
