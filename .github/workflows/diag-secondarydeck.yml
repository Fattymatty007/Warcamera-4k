name: DIAG Secondary Mission Deck

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the mission-deck-2026-27 page
        run: |
          curl -sL "https://wahapedia.ru/wh40k11ed/the-rules/mission-deck-2026-27/" -A "Mozilla/5.0 (compatible; warcamera-4k-diag-bot/1.0)" -o /tmp/page.html
      - name: Dump raw HTML for "A GRIEVOUS BLOW" and "ENGAGE ON ALL FRONTS" (FIXED/TACTICAL dual VP)
        run: |
          python3 -c "
          html = open('/tmp/page.html', encoding='utf-8', errors='replace').read()
          sm = html.find('id=\"Secondary-Mission-deck\"')
          for name in ['A GRIEVOUS BLOW', 'ENGAGE ON ALL FRONTS']:
            idx = html.find(name, sm)
            start = html.rfind('cgCard_pad', sm, idx)
            end = html.find('cgCard_pad', idx)
            print('=== ', name, ' ===')
            print(html[start:end])
            print()
          "
      - name: Count total Secondary Mission cards and list all names
        run: |
          python3 -c "
          html = open('/tmp/page.html', encoding='utf-8', errors='replace').read()
          sm = html.find('id=\"Secondary-Mission-deck\"')
          tw = html.find('id=\"Twist-deck\"')
          section = html[sm:tw]
          import re
          names = re.findall(r'<div class=\"ca7Name\">([^<]+)</div>', section)
          print('Total secondary mission cards:', len(names))
          for n in names: print(' -', n)
          "
