name: Update Points from Field Manual

on:
  schedule:
    # Weekly; GW updates the Munitorum Field Manual far less often than this,
    # but a cheap no-op run when nothing changed is fine. Use "Run workflow"
    # in the Actions tab for an immediate refresh right after GW ships one.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/fetch-points.mjs
      - name: Commit updated points data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/points-data.json
          if git diff --cached --quiet; then
            echo "No changes to points data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update points data from Munitorum Field Manual"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages deploy
        # A push made with the default GITHUB_TOKEN does not trigger other
        # workflows (GitHub's loop-prevention rule) — deploy.yml's `on: push`
        # never fires for the commit above on its own, confirmed by the
        # first real run: main had a new points-data.json commit with no
        # corresponding Pages deploy until triggered manually. Dispatch it
        # explicitly instead, only when there was actually something to ship.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
