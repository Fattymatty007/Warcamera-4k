name: Diagnostic - Inspect Wahapedia points columns

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect HTML pages for points
        run: |
          node -e '
          async function fetchHtml(url) {
            const res = await fetch(url, { headers: { "User-Agent": "Mozilla/5.0 (compatible; diag-bot/1.0)" } });
            const text = await res.text();
            console.log(`\n=== ${url}: HTTP ${res.status}, ${text.length} bytes ===`);
            return text;
          }
          (async () => {
            const dsHtml = await fetchHtml("https://wahapedia.ru/wh40k11ed/factions/adeptus-custodes/Custodian-Guard");
            const dsIdx = dsHtml.indexOf("dsUnitCostHeader");
            console.log("--- dsUnitCostHeader context (datasheet page) ---");
            console.log(dsHtml.slice(Math.max(0, dsIdx - 500), dsIdx + 800));

            const rosterHtml = await fetchHtml("https://wahapedia.ru/wh40k11ed/factions/adeptus-custodes/");
            const dpIdx = rosterHtml.indexOf("dpPts");
            console.log("--- dpPts context (faction roster page), first occurrence ---");
            console.log(rosterHtml.slice(Math.max(0, dpIdx - 800), dpIdx + 500));
            console.log("--- how many dpPts occurrences on roster page ---");
            console.log((rosterHtml.match(/dpPts/g) || []).length);
            // Dump a slightly bigger block around the 2nd occurrence too, for pattern confirmation.
            const dpIdx2 = rosterHtml.indexOf("dpPts", dpIdx + 10);
            console.log("--- dpPts context, 2nd occurrence ---");
            console.log(rosterHtml.slice(Math.max(0, dpIdx2 - 800), dpIdx2 + 500));
          })().catch(err => { console.error("FAILED:", err.message); process.exit(1); });
          '
