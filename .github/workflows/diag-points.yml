name: Diagnostic - Inspect Wahapedia points columns

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect HTML pages for points
        run: |
          node -e '
          async function fetchHtml(url) {
            const res = await fetch(url, { headers: { "User-Agent": "Mozilla/5.0 (compatible; diag-bot/1.0)" } });
            const text = await res.text();
            console.log(`\n=== ${url}: HTTP ${res.status}, ${text.length} bytes ===`);
            return text;
          }
          (async () => {
            // Individual datasheet page.
            const dsHtml = await fetchHtml("https://wahapedia.ru/wh40k11ed/factions/adeptus-custodes/Custodian-Guard");
            const ptsIdx = dsHtml.search(/pts/i);
            console.log("first \"pts\" occurrence context:", dsHtml.slice(Math.max(0, ptsIdx - 300), ptsIdx + 300));
            // Look for any class name containing "pts" or "cost" or "points".
            const classMatches = [...dsHtml.matchAll(/class="([^"]*(?:[Pp]ts|[Cc]ost|[Pp]oint)[^"]*)"/g)].map(m => m[1]);
            console.log("classes mentioning pts/cost/point:", [...new Set(classMatches)]);

            // Faction roster/army-list page (all units for a faction at once).
            const rosterHtml = await fetchHtml("https://wahapedia.ru/wh40k11ed/factions/adeptus-custodes/");
            const rosterPtsIdx = rosterHtml.search(/pts/i);
            console.log("faction page first \"pts\" occurrence context:", rosterHtml.slice(Math.max(0, rosterPtsIdx - 300), rosterPtsIdx + 300));
            const rosterClassMatches = [...rosterHtml.matchAll(/class="([^"]*(?:[Pp]ts|[Cc]ost|[Pp]oint)[^"]*)"/g)].map(m => m[1]);
            console.log("faction page classes mentioning pts/cost/point:", [...new Set(rosterClassMatches)]);
          })().catch(err => { console.error("FAILED:", err.message); process.exit(1); });
          '
