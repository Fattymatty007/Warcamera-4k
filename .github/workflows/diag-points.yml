name: Diagnostic - Inspect Wahapedia points columns

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect HTML pages for points
        run: |
          node -e '
          async function fetchHtml(url) {
            const res = await fetch(url, { headers: { "User-Agent": "Mozilla/5.0 (compatible; diag-bot/1.0)" } });
            const text = await res.text();
            console.log(`\n=== ${url}: HTTP ${res.status}, ${text.length} bytes ===`);
            return text;
          }
          (async () => {
            const rosterHtml = await fetchHtml("https://wahapedia.ru/wh40k11ed/factions/adeptus-custodes/");
            console.log("dsUnitCostHeader count on faction index page:", (rosterHtml.match(/dsUnitCostHeader/g) || []).length);
            console.log("PriceTag count on faction index page:", (rosterHtml.match(/PriceTag/g) || []).length);
            console.log("dsName count on faction index page:", (rosterHtml.match(/class="dsName"/g) || []).length);

            // Grab context around the first dsUnitCostHeader on this page, plus
            // whatever unit-name heading precedes it, to confirm pairing works
            // the same way as on the single-unit page.
            const idx = rosterHtml.indexOf("dsUnitCostHeader");
            if (idx >= 0) {
              console.log("--- context around first dsUnitCostHeader on faction index page ---");
              console.log(rosterHtml.slice(Math.max(0, idx - 1500), idx + 500));
            } else {
              console.log("No dsUnitCostHeader found on the faction index page at all.");
            }
          })().catch(err => { console.error("FAILED:", err.message); process.exit(1); });
          '
