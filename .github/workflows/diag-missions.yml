name: Diagnostic - probe Wahapedia site for mission/primary names
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try candidate mission/rules pages
        run: |
          UA="Mozilla/5.0 (compatible; warcamera-4k-diag/1.0)"
          for url in \
            "https://wahapedia.ru/wh40k11ed/the-rules/missions/" \
            "https://wahapedia.ru/wh40k11ed/the-rules/core-rules/" \
            "https://wahapedia.ru/wh40k11ed/the-rules/" \
            "https://wahapedia.ru/wh40k11ed/matched-play-missions/" \
            "https://wahapedia.ru/wh40k11ed/pariah-nexus/" \
            "https://wahapedia.ru/wh40k11ed/the-rules/pariah-nexus/" \
            ; do
            echo "=== $url ==="
            code=$(curl -s -o /tmp/page.html -w "%{http_code}" -A "$UA" "$url")
            echo "HTTP $code"
            if [ "$code" = "200" ]; then
              echo "--- title ---"
              grep -oE '<title>[^<]*</title>' /tmp/page.html | head -1
              echo "--- headings mentioning mission/primary ---"
              grep -oiE '<h[1-4][^>]*>[^<]*</h[1-4]>' /tmp/page.html | grep -iE 'mission|primary|purge|scorched|ritual|take.?and.?hold' | head -20
            fi
            echo ""
          done
      - name: Try the site search for "primary mission"
        run: |
          curl -s -A "Mozilla/5.0 (compatible; warcamera-4k-diag/1.0)" "https://wahapedia.ru/wh40k11ed/" | grep -oiE 'href="[^"]*mission[^"]*"' | sort -u

      - name: Dump the Pariah Nexus mission page around "Determine Mission"
        run: |
          UA="Mozilla/5.0 (compatible; warcamera-4k-diag/1.0)"
          curl -s -A "$UA" "https://wahapedia.ru/wh40k11ed/the-rules/pariah-nexus/" -o /tmp/pn.html
          wc -c /tmp/pn.html
          echo "--- raw snippet around Determine-Mission (2000 chars after) ---"
          python3 -c "
data = open('/tmp/pn.html', encoding='utf-8', errors='replace').read()
idx = data.find('Determine-Mission')
print(data[idx-200:idx+3000] if idx != -1 else 'NOT FOUND')
"
          echo ""
          echo "--- all table row / list-item-ish fragments mentioning mission-y words ---"
          grep -oiE '<(li|td|div)[^>]*>[^<]{3,60}</(li|td|div)>' /tmp/pn.html | grep -iE 'mission|purge|scorched|ritual|hold|storm|nexus|terraform|scour|linchpin|pariah' | sort -u | head -60
