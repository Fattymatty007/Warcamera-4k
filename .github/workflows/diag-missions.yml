name: DIAG Missions Data

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect Wahapedia export for mission-related tables
        run: |
          node -e '
          const BASE = "https://wahapedia.ru/wh40k11ed";
          const candidates = [
            "Missions.csv",
            "Mission.csv",
            "Missions_primary.csv",
            "Primary_missions.csv",
            "Rules_fragments.csv",
            "Source.csv",
          ];
          (async () => {
            for (const name of candidates) {
              try {
                const res = await fetch(`${BASE}/${name}`, { headers: { "User-Agent": "Mozilla/5.0 (compatible; warcamera-4k-diag-bot/1.0)" } });
                console.log(name, "->", res.status);
                if (res.ok) {
                  const text = await res.text();
                  const lines = text.split("\n").filter(l => l.trim().length).slice(0, 6);
                  console.log("  first lines:");
                  for (const l of lines) console.log("   ", l.slice(0, 300));
                }
              } catch (e) {
                console.log(name, "-> ERROR", e.message);
              }
            }
          })();
          '
      - name: List the data-export page itself for a table index
        run: |
          curl -sL "https://wahapedia.ru/wh40k11ed/the-rules/data-export/" -A "Mozilla/5.0 (compatible; warcamera-4k-diag-bot/1.0)" | grep -oE '[A-Za-z_]+\.csv' | sort -u
      - name: Dump full Detachments.csv header + a few rows for disposition context
        run: |
          curl -sL "https://wahapedia.ru/wh40k11ed/Detachments.csv" -A "Mozilla/5.0 (compatible; warcamera-4k-diag-bot/1.0)" | head -5
