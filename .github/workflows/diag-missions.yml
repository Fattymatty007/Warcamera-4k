name: Diagnostic - probe for secondary missions data
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try candidate CSV files
        run: |
          BASE="https://wahapedia.ru/wh40k11ed"
          for name in Missions.csv Secondary_missions.csv Secondaries.csv Mission_rules.csv Mission_deck.csv Tactical_objectives.csv Objectives.csv Mission.csv Rules.csv Rules_fragments.csv Source.csv Last_update.csv; do
            echo "=== $name ==="
            code=$(curl -s -o /tmp/out.txt -w "%{http_code}" -A "Mozilla/5.0 (compatible; warcamera-4k-diag/1.0)" "$BASE/$name")
            echo "HTTP $code"
            if [ "$code" = "200" ]; then
              head -c 2000 /tmp/out.txt
              echo ""
              echo "--- line count ---"
              wc -l /tmp/out.txt
            fi
            echo ""
          done
      - name: List the data-export page itself for clues
        run: |
          curl -s -A "Mozilla/5.0 (compatible; warcamera-4k-diag/1.0)" "https://wahapedia.ru/wh40k11ed/the-rules/data-export/" | grep -oE '[A-Za-z_]+\.csv' | sort -u
