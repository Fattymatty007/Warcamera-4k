name: Update Detachments from Wahapedia

on:
  schedule:
    # Weekly; detachment rules/enhancements/stratagems within an edition
    # change far less often than this, but a cheap no-op run when nothing
    # changed is fine. Use "Run workflow" in the Actions tab for an
    # immediate refresh right after a balance dataslate or errata update.
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-detachments.mjs
      - name: Commit updated detachments data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/detachments-data.json
          if git diff --cached --quiet; then
            echo "No changes to detachments data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update detachments data from Wahapedia"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages deploy
        # A push made with the default GITHUB_TOKEN does not trigger other
        # workflows (GitHub's loop-prevention rule) — see update-points.yml,
        # where this was confirmed for real. Dispatch it explicitly instead,
        # only when there was actually something to ship.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
