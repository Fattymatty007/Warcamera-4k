<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a08" />
    <meta name="description" content="Unit cogitator and datasheet retrieval for tabletop miniatures" />
    <!-- iOS home-screen app -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Auspex Scanner" />
    <title>AUSPEX SCANNER</title>
    <script>
      // Capture Chrome's install prompt as early as possible — it can fire
      // before the app mounts, and if we miss it the in-app Install
      // button never appears.
      (function () {
        window.__deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__deferredInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-install-available'));
        });
        window.addEventListener('appinstalled', function () {
          window.__deferredInstallPrompt = null;
          window.dispatchEvent(new CustomEvent('pwa-installed'));
        });
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div id="statusbar">
        <span><span class="dot" id="statusDot"></span><span id="statusText">STANDBY</span></span>
        <span id="statusRight">AUSPEX MK.IV</span>
      </div>
      <header>
        <h1>AUSPEX<span>&middot;</span>SCAN</h1>
        <div class="subtitle">Unit cogitator &amp; datasheet retrieval</div>
      </header>
      <main id="main"></main>
      <footer id="footer" style="display:none;"></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
